<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Создать игру</title>
<link rel="stylesheet" href="css/Styles.css">
<link rel="stylesheet" href="css/Newgame.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<main class="form">
<fieldset class="field">
<legend class="field-title">Правила</legend>
<div class="options">
<label class="opt"><input type="radio" name="rules" value="Подкидной" checked><span>Подкидной</span></label>
<label class="opt"><input type="radio" name="rules" value="Переводной"><span>Переводной</span></label>
</div>
</fieldset>

<fieldset class="field">
<legend class="field-title">Колода</legend>
<div class="options">
<label class="opt"><input type="radio" name="deck" value="24"><span>24</span></label>
<label class="opt"><input type="radio" name="deck" value="36" checked><span>36</span></label>
<label class="opt"><input type="radio" name="deck" value="52"><span>52</span></label>
</div>
</fieldset>

<fieldset class="field">
<legend class="field-title">Игроков</legend>
<div class="options">
<label class="opt"><input type="radio" name="players" value="2" checked><span>2</span></label>
<label class="opt"><input type="radio" name="players" value="3"><span>3</span></label>
<label class="opt"><input type="radio" name="players" value="4"><span>4</span></label>
<label class="opt"><input type="radio" name="players" value="5"><span>5</span></label>
<label class="opt"><input type="radio" name="players" value="6"><span>6</span></label>
</div>
</fieldset>

<div class="field">
<label class="field-title" for="bet">Ставка</label>
<input id="bet" type="number" inputmode="numeric" min="100" step="1" value="100">
<p class="hint" id="betHint">Минимум 100</p>
</div>
</main>

<footer class="bar">
<button class="create" id="createBtn" type="button">Создать игру</button>
</footer>

<script src="js/Games.js"></script>
<script src="js/Newgame.js"></script>
</body>
</html>
